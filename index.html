<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KKUMI ARCHIVE</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        /* Base Settings */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #050505;
            overflow: hidden;
            color: #e5e7eb;
        }

        /* Map Container */
        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-color: #0a0a0a;
        }

        /* Ultra-modern Glassmorphism */
        .glass-panel {
            background: rgba(15, 15, 18, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        /* Overlays */
        .header-overlay {
            position: absolute;
            top: 32px;
            left: 32px;
            z-index: 1000;
            padding: 1.25rem 2rem;
            border-radius: 24px;
            text-align: left;
        }

        /* Typography */
        h1 {
            letter-spacing: 0.15em;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            letter-spacing: 0.05em;
            font-weight: 400;
            color: #a1a1aa;
            margin-top: 4px;
        }

        /* Custom Marker Wrapper */
        .custom-marker-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 1. Neon Glowing Dot */
        .neon-marker {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .neon-core {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff00ff;
            box-shadow: 0 0 12px #ff00ff, 0 0 24px #ff00ff;
            z-index: 2;
        }

        .neon-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
            z-index: 1;
            animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            80% { transform: scale(2.5); opacity: 0; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* 2. Glassmorphism Info Card (Hidden by default) */
        .marker-card {
            position: absolute;
            bottom: 25px; /* Sit right above the glowing dot */
            left: 50%;
            width: 160px;
            padding: 8px;
            border-radius: 16px;
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 0, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 0, 255, 0.1);
            
            /* Initial Hidden State */
            opacity: 0;
            transform: translate(-50%, 15px) scale(0.85);
            transform-origin: bottom center;
            pointer-events: none;
            
            /* Smooth Premium Transition */
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        /* When map zoom level is high enough, .show-detail is added to #map */
        .show-detail .marker-card {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
            pointer-events: auto;
        }

        /* Card Content Styles */
        .marker-card-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #2a2a2a;
        }

        .marker-card-title {
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Mobile Adjustments */
        @media (max-width: 640px) {
            .header-overlay { top: 20px; left: 20px; padding: 1rem 1.5rem; }
            h1 { font-size: 1.25rem; }
            .subtitle { font-size: 0.75rem; }
            .marker-card { width: 140px; }
            .marker-card-img { height: 80px; }
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- UI Header -->
    <header class="header-overlay glass-panel">
        <h1 class="text-xl md:text-2xl m-0">KKOOMI ARCHIVE</h1>
        <p class="subtitle text-sm">꾸미가족의 발자취</p>
    </header>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Map Initialization
        // Centered around Seoul/Gyeonggi, Default Zoom 10
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([37.5, 126.9], 10);

        // Minimal controls
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.control.attribution({ position: 'bottomleft', prefix: false })
            .addAttribution('&copy; Esri &mdash; Esri, DeLorme, NAVTEQ')
            .addTo(map);

        // Load Esri Dark Gray Base Tile (NO API KEY REQUIRED)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16
        }).addTo(map);

        // 2. Exact Location Data & Images
        const archiveData = [
            { 
                title: '카페 모닥 남양주', 
                coords: [37.6321, 127.2405], 
                img: 'KakaoTalk_20261106_130002081_02.jpg' 
            },
            { 
                title: '무의도 해상탐방로', 
                coords: [37.3820, 126.4168], 
                img: 'KakaoTalk_20261106_130002081.jpg' 
            },
            { 
                title: '마부자 생삼겹살', 
                coords: [37.5606, 126.8335], 
                img: 'KakaoTalk_20261106_130002081_01.jpg' 
            },
            { 
                title: '더노벰버라운지 하남', 
                coords: [37.5521, 127.1932], 
                img: 'KakaoTalk_20261106_130151473.jpg' 
            }
        ];

        // 3. Custom Zoom-Reveal Marker Generator
        function createRevealMarker(item) {
            return L.divIcon({
                html: `
                    <div class="custom-marker-wrapper">
                        <!-- Glassmorphism Card (Revealed on Zoom) -->
                        <div class="marker-card">
                            <img src="${item.img}" alt="${item.title}" class="marker-card-img" loading="lazy">
                            <div class="marker-card-title">${item.title}</div>
                        </div>
                        
                        <!-- Neon Core Dot (Always Visible) -->
                        <div class="neon-marker">
                            <div class="neon-pulse"></div>
                            <div class="neon-core"></div>
                        </div>
                    </div>
                `,
                className: '', // Clear default Leaflet background
                iconSize: [20, 20], // Set to size of the neon dot
                iconAnchor: [10, 10] // Anchor exactly at the center of the neon dot
            });
        }

        // 4. Add Markers to Map
        archiveData.forEach(item => {
            L.marker(item.coords, {
                icon: createRevealMarker(item)
            }).addTo(map);
        });

        // 5. Zoom-Based Interaction Logic
        const mapContainer = document.getElementById('map');
        const REVEAL_ZOOM_LEVEL = 12;

        function updateMarkerVisibility() {
            if (map.getZoom() >= REVEAL_ZOOM_LEVEL) {
                mapContainer.classList.add('show-detail');
            } else {
                mapContainer.classList.remove('show-detail');
            }
        }

        // Check on initial load
        updateMarkerVisibility();

        // Listen for zoom events to trigger the CSS transition
        map.on('zoomend', updateMarkerVisibility);

    </script>
</body>
</html>
